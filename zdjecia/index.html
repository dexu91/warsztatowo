<section id="zdjecia" class=""zdjecia>
    <header>
        <h2>Galeria Warsztatu</h2>
    </header>

<div class="gallery-container">
    <div id="thumbnails-container" class="thumbnails"></div>

    <div class="main-view">
    <div class="nav-zone left-zone" onclick="changeSlide(-1)">
        <span class="arrow">&#10094;</span>
    </div>

    <img id="expandedImg" src="" onclick="/* usunięto stary onclick ze zdjęcia, strefy go zastępują */">

    <div class="nav-zone right-zone" onclick="changeSlide(1)">
        <span class="arrow">&#10095;</span>
    </div>
</div>
</div>
</section>

<script>
    const photoList = ["auto.png", "merc.webp", "merc2.webp", "sprzeglo.webp", "plac.webp", "bmw1.webp", "bmw2.webp", "merc3.webp", "merc4.webp", "merc5.webp", "merc6.webp", "porsche1.webp", "porsche2.webp", "toyota1.webp", "toyota2.webp", "toyota3.webp", "toyota4.webp"];
    const folderPath = ""; 
    let currentIndex = 0;
    
    const thumbContainer = document.getElementById("thumbnails-container");
    const expandedImg = document.getElementById("expandedImg");

    function initGallery() {
        if (!thumbContainer) return;
        thumbContainer.innerHTML = ""; 
        photoList.forEach((fileName, index) => {
            const img = document.createElement("img");
            img.src = folderPath + fileName;
            img.className = "thumb";
            if (index === 0) img.classList.add("active-thumb");
            img.onclick = function() { currentSlide(index); };
            thumbContainer.appendChild(img);
        });
        updateGallery(0);
        setupSwipe(); 
    }

    function updateGallery(index) {
        currentIndex = index;
        if (currentIndex >= photoList.length) currentIndex = 0;
        if (currentIndex < 0) currentIndex = photoList.length - 1;
        expandedImg.src = folderPath + photoList[currentIndex];
        
        const allThumbs = document.querySelectorAll('.thumb');
        allThumbs.forEach(img => img.classList.remove('active-thumb'));
        if(allThumbs[currentIndex]) allThumbs[currentIndex].classList.add('active-thumb');
    }

    function currentSlide(n) { updateGallery(n); }
    function changeSlide(n) { updateGallery(currentIndex + n); }


    // Obsługa dotyku (Swipe) zostaje bez zmian
    let touchstartX = 0;
    let touchendX = 0;
    function setupSwipe() {
        expandedImg.addEventListener('touchstart', e => { touchstartX = e.changedTouches[0].screenX; }, {passive: true});
        expandedImg.addEventListener('touchend', e => { touchendX = e.changedTouches[0].screenX; handleGesture(); }, {passive: true});
    }
    function handleGesture() {
        if (touchendX < touchstartX - 50) changeSlide(1);
        if (touchendX > touchstartX + 50) changeSlide(-1);
    }

    window.onload = initGallery;
</script>
